[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "masknmf"
version = "0.1.0"
description = "CPU/headless masknmf pipeline for motion correction, denoising, compression, and demixing of functional neuroimaging data"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11, <3.14"
authors = [
    { name = "Amol Pasarkar" },
]
keywords = ["neuroimaging", "motion correction", "demixing", "calcium imaging", "headless", "cpu"]

# Headless / CPU-only runtime.  The GPU stack (fastplotlib, imgui_bundle,
# pygfx, glfw, simplejpeg, jupyterlab) has been intentionally removed.  Torch
# is installed CPU-only by default - any PyTorch wheel works, but the CPU
# wheels are smaller and have no CUDA runtime.
dependencies = [
    "torch>2",
    "numpy",
    "scipy",
    "h5py",
    "scikit-image",
    "cvxpy>=1.6.5",
    "networkx",
    "tqdm",
    "plotly",
    "matplotlib",
    "pytorch-lightning>=2.5.2",
    "tensorboard>=2.20.0",
]

[project.optional-dependencies]
docs = [
    "sphinx>=7",
    "pydata-sphinx-theme",
    "sphinx-copybutton",
    "sphinx-design",
    "myst-parser",
]

dev = [
    "pytest>=8.4.0",
    "ruff>=0.11.13",
    "nbmake",
    "masknmf[docs]",
]


[project.urls]
Homepage = "https://github.com/apasarkar/masknmf-toolbox"
Repository = "https://github.com/apasarkar/masknmf-toolbox"
Issues = "https://github.com/apasarkar/masknmf-toolbox/issues"
Documentation = "https://apasarkar.github.io/masknmf-toolbox/"
